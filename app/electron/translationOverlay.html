<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .container {
            width: 100vw;
            height: 100vh;
            padding: 12px;
        }

        .card {
            background: rgba(28, 28, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-app-region: drag;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-badge {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .btn-icon {
            width: 28px;
            height: 28px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-icon svg {
            width: 14px;
            height: 14px;
        }

        .btn-close {
            background: rgba(255, 59, 48, 0.2);
            color: rgba(255, 59, 48, 0.8);
        }

        .btn-close:hover {
            background: rgba(255, 59, 48, 0.3);
            color: rgb(255, 59, 48);
        }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-app-region: no-drag;
        }

        .translation-text {
            color: rgba(255, 255, 255, 0.95);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 12px;
            cursor: text;
            user-select: text;
        }

        /* Original text toggle */
        .original-section {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .original-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.15s ease;
        }

        .original-toggle:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .original-toggle svg {
            width: 10px;
            height: 10px;
            transition: transform 0.2s ease;
        }

        .original-toggle.expanded svg {
            transform: rotate(180deg);
        }

        .original-text {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            line-height: 1.5;
            margin-top: 8px;
            display: none;
            cursor: text;
            user-select: text;
        }

        .original-text.visible {
            display: block;
        }

        /* History section */
        .history-section {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-title {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-clear {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .history-clear:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
        }

        .history-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .history-list::-webkit-scrollbar {
            display: none;
        }

        .history-item {
            flex-shrink: 0;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            max-width: 120px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-item-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Copied notification */
        .copied-toast {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(52, 199, 89, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .copied-toast.visible {
            opacity: 1;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <span class="lang-badge" id="langBadge">EN → RU</span>
                </div>
                <div class="header-right">
                    <button class="btn-icon" id="copyBtn" title="Копировать">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button class="btn-icon btn-close" id="closeBtn" title="Закрыть">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div class="content" id="content">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 5h12M3 10h16M3 15h8M3 20h12"></path>
                    </svg>
                    <span class="empty-state-text">Скопируйте текст для перевода</span>
                </div>
                <div id="translationContent" style="display: none;">
                    <div class="translation-text" id="translationText"></div>
                    <div class="original-section">
                        <button class="original-toggle" id="originalToggle">
                            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="2,4 6,8 10,4"></polyline>
                            </svg>
                            <span>Показать оригинал</span>
                        </button>
                        <div class="original-text" id="originalText"></div>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div class="history-section" id="historySection" style="display: none;">
                <div class="history-header">
                    <span class="history-title">История</span>
                    <button class="history-clear" id="historyClear">Очистить</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>

            <!-- Copied toast -->
            <div class="copied-toast" id="copiedToast">Скопировано!</div>
        </div>
    </div>

    <script>
        const langBadge = document.getElementById('langBadge');
        const translationText = document.getElementById('translationText');
        const originalText = document.getElementById('originalText');
        const originalToggle = document.getElementById('originalToggle');
        const translationContent = document.getElementById('translationContent');
        const emptyState = document.getElementById('emptyState');
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        const copiedToast = document.getElementById('copiedToast');
        const content = document.getElementById('content');
        const card = document.querySelector('.card');

        let currentTranslation = null;

        // Mouse events for auto-hide
        card.addEventListener('mouseenter', () => {
            window.translationAPI.notifyMouseEnter();
        });

        card.addEventListener('mouseleave', () => {
            window.translationAPI.notifyMouseLeave();
        });

        // Close button
        document.getElementById('closeBtn').addEventListener('click', () => {
            window.translationAPI.close();
        });

        // Copy button
        document.getElementById('copyBtn').addEventListener('click', () => {
            if (currentTranslation) {
                window.translationAPI.copyText(currentTranslation.translatedText);
                showCopiedToast();
            }
        });

        // Original toggle
        originalToggle.addEventListener('click', () => {
            const isVisible = originalText.classList.contains('visible');
            originalText.classList.toggle('visible');
            originalToggle.classList.toggle('expanded');
            originalToggle.querySelector('span').textContent = isVisible ? 'Показать оригинал' : 'Скрыть оригинал';
        });

        // Clear history
        document.getElementById('historyClear').addEventListener('click', () => {
            window.translationAPI.clearHistory();
            historySection.style.display = 'none';
        });

        // Receive translation data
        window.translationAPI.onTranslationData((data) => {
            currentTranslation = data;

            // Update UI
            const sourceLang = data.sourceLang?.toUpperCase() || 'EN';
            const targetLang = data.targetLang?.toUpperCase() || 'RU';
            langBadge.textContent = `${sourceLang} → ${targetLang}`;

            translationText.textContent = data.translatedText;
            originalText.textContent = data.originalText;

            // Reset original section
            originalText.classList.remove('visible');
            originalToggle.classList.remove('expanded');
            originalToggle.querySelector('span').textContent = 'Показать оригинал';

            // Show content
            emptyState.style.display = 'none';
            translationContent.style.display = 'block';

            // Update history
            if (data.history && data.history.length > 1) {
                updateHistoryUI(data.history.slice(1)); // Skip current translation
            }
        });

        // Receive history updates
        window.translationAPI.onHistoryUpdate((history) => {
            updateHistoryUI(history);
        });

        function updateHistoryUI(history) {
            if (!history || history.length === 0) {
                historySection.style.display = 'none';
                return;
            }

            historySection.style.display = 'block';
            historyList.innerHTML = '';

            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div class="history-item-text">${item.translatedText}</div>`;
                div.addEventListener('click', () => {
                    currentTranslation = item;
                    translationText.textContent = item.translatedText;
                    originalText.textContent = item.originalText;

                    const sourceLang = item.sourceLang?.toUpperCase() || 'EN';
                    const targetLang = item.targetLang?.toUpperCase() || 'RU';
                    langBadge.textContent = `${sourceLang} → ${targetLang}`;
                });
                historyList.appendChild(div);
            });
        }

        function showCopiedToast() {
            copiedToast.classList.add('visible');
            setTimeout(() => {
                copiedToast.classList.remove('visible');
            }, 1500);
        }

        // Double-click to copy translation
        translationText.addEventListener('dblclick', () => {
            if (currentTranslation) {
                window.translationAPI.copyText(currentTranslation.translatedText);
                showCopiedToast();
            }
        });
    </script>
</body>
</html>
