<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay-wrapper">
    <div class="overlay-container" id="overlay">
      <!-- Drag area (background, enables window dragging) -->
      <div class="drag-area"></div>

      <!-- Inner content (visible only when expanded) -->
      <div class="overlay-content">
        <!-- Stop button (click to stop recording) -->
        <button class="stop-btn" id="stopBtn" title="Stop recording">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="1"/>
          </svg>
        </button>

        <!-- Audio bars -->
        <div class="audio-bars" id="audioBars">
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
        </div>

        <!-- Timer display -->
        <span class="timer-text" id="timerText">0:00</span>

        <!-- Hidden status dot for state tracking -->
        <div class="status-dot" id="statusDot" style="display:none;"></div>

        <!-- Tab-Complete indicator -->
        <div class="tab-complete-indicator" id="tabCompleteIndicator">
          <svg class="ai-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
          <span class="tab-complete-text">AI</span>
        </div>

        <!-- Meeting recording indicator -->
        <div class="meeting-indicator" id="meetingIndicator">
          <svg class="meeting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span class="meeting-time" id="meetingTime">0:00</span>
        </div>

        <!-- Close button -->
        <button class="close-btn" id="closeBtn" title="Hide overlay">×</button>
      </div>

      <!-- Streaming text (hidden) -->
      <div class="streaming-text" id="streamingText"></div>

      <!-- U6 (28.04.2026): first-run hint что overlay перетаскиваемый -->
      <div class="drag-hint" id="dragHint" style="display: none;">
        Перетащите в удобное место
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
